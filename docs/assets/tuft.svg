<svg xmlns="http://www.w3.org/2000/svg" class="tuft  " width="180" height="198.00000000000003" viewBox="0 0 200 220" role="img" aria-label="Tuft, the Featherbound mascot"><style>
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes hatwiggle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@keyframes tailflick { 0%, 70%, 100% { transform: rotate(0deg); } 78% { transform: rotate(-7deg); } 86% { transform: rotate(3deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.1); } }
.tuft-body { animation: bob 3.2s ease-in-out infinite; transform-origin: 100px 150px; }
.tuft-hat { animation: hatwiggle 4s ease-in-out infinite; transform-origin: 100px 90px; transform-box: view-box; }
.tuft-tail { animation: tailflick 4.4s ease-in-out infinite; transform-origin: 132px 170px; transform-box: view-box; }
.tuft-eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
.tuft-spark { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.tuft-spark:nth-of-type(2) { animation-delay: 0.6s; }
.tuft-spark:nth-of-type(3) { animation-delay: 1.2s; }
